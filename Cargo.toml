[workspace]
resolver = "2"
members = [
    "crates/recast-schema",
    "crates/recast-ir",
    "crates/recast-frontend",
    "crates/recast-analysis",
    "crates/recast-translate",
    "crates/recast-rt",
    "crates/recast-verify",
    "crates/recast-interop",
    "crates/recast-orchestrator",
    "crates/recast-cli",
    "crates/recast-testkit",
    "xtask",
]

[workspace.package]
version = "1.0.4"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
