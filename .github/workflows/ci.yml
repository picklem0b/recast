name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fast:
    name: Fast pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang and LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev llvm-dev cmake ninja-build

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-targets

      - name: Goldens
        run: cargo run -p xtask -- check-goldens

      - name: Documentation links
        run: python3 ci/check-docs.py

      - name: Fast pipeline and determinism
        run: bash ci/fast.sh

      - name: Build exporter
        run: |
          cmake -S exporter -B exporter/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build exporter/build -j 2

      - name: Exporter pipeline
        run: bash ci/exporter.sh
