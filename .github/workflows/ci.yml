name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fast:
    name: Fast pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang and LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev llvm-dev cmake ninja-build

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-targets

      - name: Goldens
        run: cargo run -p xtask -- check-goldens

      - name: Documentation links
        run: python3 ci/check-docs.py

      - name: Fast pipeline and determinism
        run: bash ci/fast.sh

      - name: Build exporter
        run: |
          cmake -S exporter -B exporter/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build exporter/build -j 2

      - name: M0 exit criteria
        run: bash ci/m0-exit.sh

      - name: M1 exit criteria
        run: bash ci/m1-exit.sh

      - name: M2 corpus
        run: bash ci/m2-corpus.sh

      - name: M3 exit criteria
        run: bash ci/m3-exit.sh

      - name: M2 refusals
        run: bash ci/m2-refusals.sh

      - name: C++ refusals
        run: bash ci/cpp-refusals.sh

  miri:
    name: V4 Miri (nightly)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # The repository pins a stable toolchain; Miri needs nightly. The
      # override also reaches the sandboxed `cargo miri` run in ci/miri.sh.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang and LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev llvm-dev cmake ninja-build

      - name: Install nightly with Miri
        run: |
          rustup toolchain install nightly --profile minimal \
            --component miri --component rust-src --component clippy
          cargo miri --version

      - name: Build exporter
        run: |
          cmake -S exporter -B exporter/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build exporter/build -j 2

      - name: V4 Miri check
        run: bash ci/miri.sh
